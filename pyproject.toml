[project]
name = "data-quality-agent"
version = "0.1.0"
description = "Data Quality Auto-Fixing & Validation Agent -- deterministic detection, LLM-advised fixes, human approval, verified results"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-groq>=1.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gemini = ["langchain-google-genai>=2.0"]
openai = ["langchain-openai>=0.3"]
ollama = ["langchain-ollama>=0.3"]
all-providers = ["data-quality-agent[gemini,openai,ollama]"]
dev = ["pytest>=8.1", "pytest-cov>=5.0", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
dq-agent = "dq_agent.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dq_agent = ["web/*", "resources/samples/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/dq_agent/api/*.py" = ["B008"]
